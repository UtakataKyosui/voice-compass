name: CI
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      test_base: ${{ steps.filter.outputs.test_base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        shell: bash
        run: |
          frontend=false
          rust=false
          test_base="$BASE"
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}"; then
            frontend=true
            rust=true
            test_base=''
          else
            if git diff --name-status --no-renames "$BASE" "$HEAD" | grep -qv '^M[[:space:]]src/'; then
              test_base=''
            fi
            while IFS= read -r -d '' file; do
              case "$file" in
                src-tauri/*) rust=true ;;
                src/*|public/*) frontend=true ;;
                README.md|LICENSE) ;;
                *) frontend=true; rust=true ;;
              esac
            done < <(git diff --name-only -z "$BASE" "$HEAD")
          fi
          {
            echo "frontend=$frontend"
            echo "rust=$rust"
            echo "test_base=$test_base"
          } >> "$GITHUB_OUTPUT"
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24.22.1"
          cache: true
      - run: vp install --frozen-lockfile
      # Existing project files have formatting violations; lint independently.
      - run: vp check --no-fmt
      - run: vp fmt --check .github/workflows .github/dependabot.yml
      - run: vp run lint:biome
      - run: vp run lint:fallow
      - run: vp run lint:duplicates
      - name: Test affected files
        if: needs.changes.outputs.test_base != ''
        env:
          BASE: ${{ needs.changes.outputs.test_base }}
        run: vp test --changed "$BASE" --passWithNoTests
      - name: Test all files
        if: needs.changes.outputs.test_base == ''
        run: vp test --passWithNoTests
      - run: vp run build
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24.22.1"
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      - run: vp install --frozen-lockfile
      - run: vp run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2
      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock
  rust-unused-dependencies:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-machete
          key: cargo-machete-${{ runner.os }}-${{ runner.arch }}-0.9.1
      - name: Install cargo-machete
        run: command -v cargo-machete || cargo install cargo-machete --version 0.9.1 --locked
      - run: cargo machete src-tauri
  javascript-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24.22.1"
      - run: vp pm audit -- --prod
